<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-label="Gremlin: a gremlin peeking over a page">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e88a68"/>
      <stop offset="1" stop-color="#cf6a49"/>
    </linearGradient>
    <clipPath id="above-page"><rect x="0" y="0" width="420" height="190"/></clipPath>
  </defs>

  <!-- head and ears, hidden below the page edge -->
  <g clip-path="url(#above-page)" stroke="#6b2f1d" stroke-width="6" stroke-linejoin="round">
    <path d="M132 150 L36 64 L150 104 Z" fill="url(#skin)"/>
    <path d="M288 150 L384 64 L270 104 Z" fill="url(#skin)"/>
    <path d="M124 132 L66 80 L138 106 Z" fill="#f4bba7" stroke="none"/>
    <path d="M296 132 L354 80 L282 106 Z" fill="#f4bba7" stroke="none"/>
    <ellipse cx="210" cy="196" rx="104" ry="96" fill="url(#skin)"/>
    <!-- brows -->
    <path d="M150 128 Q170 116 190 128" fill="none" stroke-width="7" stroke-linecap="round"/>
    <path d="M230 128 Q250 116 270 128" fill="none" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- eyes, looking to the side -->
  <g stroke="#6b2f1d" stroke-width="5">
    <ellipse cx="172" cy="156" rx="21" ry="24" fill="#fff"/>
    <ellipse cx="248" cy="156" rx="21" ry="24" fill="#fff"/>
  </g>
  <circle cx="180" cy="160" r="10" fill="#2a1712"/>
  <circle cx="256" cy="160" r="10" fill="#2a1712"/>
  <circle cx="183" cy="156" r="3.2" fill="#fff"/>
  <circle cx="259" cy="156" r="3.2" fill="#fff"/>

  <!-- the page -->
  <rect x="24" y="190" width="372" height="104" rx="10" fill="#fbf9f6" stroke="#d9d3ca" stroke-width="3"/>
  <path d="M60 222 L84 238 L60 254" fill="none" stroke="#d97757" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="98" y="248" width="34" height="9" rx="4.5" fill="#d97757"/>
  <rect x="160" y="224" width="200" height="8" rx="4" fill="#e7e1d8"/>
  <rect x="160" y="246" width="150" height="8" rx="4" fill="#e7e1d8"/>
  <rect x="60" y="270" width="230" height="8" rx="4" fill="#e7e1d8"/>

  <!-- nose resting on the edge -->
  <path d="M196 174 Q210 162 224 174 Q232 190 210 196 Q188 190 196 174 Z" fill="#b8573a" stroke="#6b2f1d" stroke-width="5" stroke-linejoin="round"/>

  <!-- hands gripping the edge -->
  <g fill="url(#skin)" stroke="#6b2f1d" stroke-width="5">
    <rect x="86" y="172" width="17" height="34" rx="8.5"/>
    <rect x="104" y="168" width="17" height="38" rx="8.5"/>
    <rect x="122" y="170" width="17" height="36" rx="8.5"/>
    <rect x="281" y="170" width="17" height="36" rx="8.5"/>
    <rect x="299" y="168" width="17" height="38" rx="8.5"/>
    <rect x="317" y="172" width="17" height="34" rx="8.5"/>
  </g>
</svg>
